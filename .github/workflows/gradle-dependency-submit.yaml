name: Dependency Submission

# See https://github.com/gradle/actions/blob/768a17f3488dc3fe0155ff431553e1f53d57e22e/dependency-submission/README.md#the-dependency-submission-action
# The action allows GitHub to alert about reported vulnerabilities in the project
on:
  push:
    branches:
      - master

# Declare default permissions as read-only.
permissions: read-all

jobs:
  dependency-submission:
    name: Submit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: zulu
        java-version: 21
        server-id: central
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        # Use the open-source cache implementation; the default 'enhanced' provider
        # loads the proprietary gradle-actions-caching component (gradle/actions v6+)
        cache-provider: basic
